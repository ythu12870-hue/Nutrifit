<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition - NeutriFIT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
       :root {
            --bg-dark: #0d0f17;
            --sidebar-bg: #090a10;
            --card-bg: #161822;
            --icon-bg: #1e202d;
            
            --primary-cyan: #00e5ff;
            --accent-green: #00c853;
            --green-hover: #00e676;
            --text-white: #ffffff;
            --text-muted: #9e9e9e;
            
            --border-color: #00e5ff33;
            --radius-lg: 16px;
            --radius-md: 20px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Side-by-side Layout Structure */
        body {
            background: #1e202d;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Section */
        .sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-white);
        }

        .logo span {
            color: var(--primary-cyan);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            display: block;
            padding: 10px 16px;
            color: var(--accent-green);
            text-decoration: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .nav-btn:hover {
            background-color: rgba(0, 229, 255, 0.1);
        }

        .nav-btn.active {
            background-color: var(--primary-cyan);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-cyan);
        }

        /* Main Content Container */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            color: #00c853;
            font-size: 36px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            background-color: #090a10;
        }

        /* Nutrition Charts Grid */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            justify-content: center;
            align-items: start;
        }

        .chart-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin-bottom: 12px;
        }

        /* AI Chat Box Button Styling (New Added) */
        .ai-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            border: 1.5px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #0f172a;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .ai-chat-btn:hover {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            border-color: #94a3b8;
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .ai-chat-btn i {
            color: #00c853;
            font-size: 18px;
        }
    </style>

    <link rel="stylesheet" href="responsive.css">
    <script src="menu.js" defer></script>
</head>
<body>

    <!-- Responsive mobile menu -->
    <button class="mobile-menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="mobile-menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <div class="mobile-menu-overlay" data-menu-close></div>
    <aside id="mobile-menu" class="mobile-menu" aria-hidden="true">
        <div class="mobile-menu-header">
            <div class="mobile-menu-logo"><span>⚡️</span> NeutriFIT</div>
            <button class="mobile-menu-close" type="button" aria-label="Close navigation menu" data-menu-close>×</button>
        </div>
        <nav class="mobile-menu-links" aria-label="Mobile navigation">
            <a href="home.html">Home</a>
            <a href="index.html">BMI Calculation</a>
            <a href="workoutplan.html">Workout Planner</a>
            <a href="nutrition.html">Nutrition</a>
            <a href="supplements.html">Supplements</a>
            <a href="info.html">Info</a>
        </nav>
    </aside>


    <!-- Sidebar Bar -->
    <aside class="sidebar">
        <div class="logo">
            <span>⚡️</span> NeutriFIT
        </div>
        <nav class="nav-links">
            <a href="home.html" class="nav-btn">Home</a>
            <a href="index.html" class="nav-btn">Bmi calculation</a>
            <a href="workoutplan.html" class="nav-btn">Workout Planner</a>
            <a href="nutrition.html" class="nav-btn active">Nutrition</a>
            <a href="supplements.html" class="nav-btn">Supplements</a>
            <a href="info.html" class="nav-btn">Info</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        <h1 class="page-title">Nutrition</h1>
        
        <!-- Calories Chart Images Section -->
        <div class="charts-container">
            <div class="chart-card">
                <img src="media/bp1.jpg" alt="Burmese Food Calories Chart 1">
                
                <!-- ပြင်ဆင်ထားသော AI Chat Box Button -->
                <a href="https://chatgpt.com/share/6a77343a-52ac-83ec-bcec-57f091e00f73?ogimg=plain" target="_blank" class="ai-chat-btn">
                   <i class="fa-solid fa-robot"></i> AI Chat Box
                </a>
            </div>
            
            <div class="chart-card">
                <img src="media/bp2.jpg" alt="Burmese Food Calories Chart 2">
            </div>
        </div>
    </div>

</body>
</html>
