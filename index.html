<script id="recommendation-result-links-script">
(function () {
    const recommendationPages = {
        "underweight": "underweight.html",
        "normal": "normal.html",
        "normal weight": "normal.html",
        "overweight": "overweight.html",
        "obese": "obese.html"
    };

    function findResultElement() {
        const candidates = Array.from(document.querySelectorAll(
            '[id*="result" i], [class*="result" i], [id*="bmi" i], [class*="bmi" i]'
        ));

        return candidates.find(el => {
            const text = (el.textContent || "").trim().toLowerCase();
            return Object.keys(recommendationPages).some(key =>
                new RegExp("\\b" + key.replace(" ", "\\s+") + "\\b", "i").test(text)
            );
        }) || null;
    }

    function addRecommendationLink() {
        const resultEl = findResultElement();
        if (!resultEl) return;

        const text = (resultEl.textContent || "").trim().toLowerCase();
        let page = null;
        let label = null;

        for (const [key, value] of Object.entries(recommendationPages)) {
            const pattern = new RegExp("\\b" + key.replace(" ", "\\s+") + "\\b", "i");
            if (pattern.test(text)) {
                page = value;
                label = key;
                break;
            }
        }

        if (!page) return;

        const existing = resultEl.querySelector(".recommendation-link");
        if (existing) {
            existing.href = page;
            return;
        }

        const link = document.createElement("a");
        link.className = "recommendation-link";
        link.href = page;
        link.textContent = "View your " + label + " recommendations →";
        link.setAttribute("aria-label", "View " + label + " workout and nutrition recommendations");

        resultEl.appendChild(document.createElement("br"));
        resultEl.appendChild(link);
    }

    // Works with normal button-based BMI calculators and dynamic result updates.
    document.addEventListener("click", function () {
        setTimeout(addRecommendationLink, 50);
        setTimeout(addRecommendationLink, 300);
    });

    // Also watches for dynamically changed BMI result text.
    const observer = new MutationObserver(addRecommendationLink);
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });

    document.addEventListener("DOMContentLoaded", function () {
        addRecommendationLink();
    });
})();
</script>


<script id="recommendation-window-hook">
(function () {
    const originalOpen = window.open;

    window.open = function () {
        const reportWindow = originalOpen.apply(window, arguments);

        if (!reportWindow) {
            return reportWindow;
        }

        const timer = setInterval(function () {
            try {
                const doc = reportWindow.document;
                const statusElement = doc.querySelector(".status-text");

                if (!statusElement) return;

                const status = statusElement.textContent.trim().toLowerCase();

                const pages = {
                    "underweight": "underweight.html",
                    "normal weight": "normal.html",
                    "overweight": "overweight.html",
                    "obese": "obese.html"
                };

                const page = pages[status];
                if (!page) return;

                if (doc.querySelector(".recommendation-btn")) {
                    clearInterval(timer);
                    return;
                }

                const style = doc.createElement("style");
                style.textContent = `
                    .recommendation-btn {
                        display: inline-block;
                        margin-top: 14px;
                        padding: 11px 20px;
                        border: 2px solid #00e676;
                        border-radius: 6px;
                        background-color: #3f4453;
                        color: #00e676;
                        text-decoration: none;
                        font-family: Arial, sans-serif;
                        font-weight: bold;
                        cursor: pointer;
                        transition: all 0.3s ease;
                    }
                    .recommendation-btn:hover {
                        background-color: #2b2e38;
                        color: #00ff75;
                        box-shadow: 0 0 15px #00e676, inset 0 0 5px #00e676;
                    }
                `;
                doc.head.appendChild(style);

                const link = doc.createElement("a");
                link.className = "recommendation-btn";
                link.href = page;
                link.textContent = "View Your " + status + " Workout & Nutrition →";

                statusElement.insertAdjacentElement("afterend", link);

                clearInterval(timer);
            } catch (error) {
                // The new tab may be writing its document; try again on the next interval.
            }
        }, 50);

        return reportWindow;
    };
})();
</script>

</body>
