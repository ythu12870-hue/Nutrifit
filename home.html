<!DOCTYPE html>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    background:#06080d;
    color:white;
    overflow:hidden;
}

/* Sidebar */
.sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-white);
        }

        .logo span {
            color: var(--primary-cyan);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-btn {
            display: block;
            padding: 10px 16px;
            color: var(--accent-green);
            text-decoration: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: left;
        }

        .nav-btn:hover {
            background-color: rgba(0, 229, 255, 0.1);
        }

        .nav-btn.active {
            background-color: var(--primary-cyan);
            color: #000;
            font-weight: bold;
            border-color: var(--primary-cyan);
        }

/* Main */

.main{
    flex:1;
    position:relative;
}

.hero{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* Background Shapes */

.hero::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:#11151f;
    transform:rotate(45deg);
    top:-250px;
    left:250px;
}

.hero::after{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    background:#11151f;
    transform:rotate(45deg);
    bottom:-300px;
    right:-100px;
}

/* Image */

.hero-img{
    position:absolute;
    height:100%;
    left:45%;
    transform:translateX(-50%);
    bottom:0;
    z-index:3;
}

/* Text */

.leftText{
    position:absolute;
    left:90px;
    top:70px;
    font-size:105px;
    font-weight:900;
    line-height:95px;
    color:white;
    text-shadow:0 0 15px #00ff88;
    z-index:4;
}

.rightText{
    position:absolute;
    right:80px;
    bottom:90px;
    font-size:95px;
    font-weight:900;
    line-height:90px;
    color:white;
    text-shadow:0 0 15px #00ff88;
    z-index:4;
}

/* Credit */

.credit{
    position:absolute;
    top:70px;
    right:80px;
    z-index:5;
}

.credit p{
    color:#d6d6d6;
}

.credit h2{
    font-weight:600;
}

/* Arrows */

.arrow{
    position:absolute;
    color:#00ff88;
    font-size:70px;
    text-shadow:0 0 20px #00ff88;
    z-index:5;
}

.left{
    bottom:50px;
    left:80px;
}

.right{
    top:240px;
    right:70px;
    transform:rotate(90deg);
}
</style>
